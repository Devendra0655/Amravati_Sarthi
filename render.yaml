services:
  - type: web
    name: amravati-sarthi
    runtime: python
    region: singapore
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn backend.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: GROQ_API_KEY
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: MOCK_AI
        value: "false"
      - key: PYTHON_VERSION
        value: "3.11"
    autoDeploy: true