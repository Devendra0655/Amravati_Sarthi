services:
  - type: web
    name: amravati-sarthi-api
    runtime: python
    region: singapore          # closest to Amravati, Maharashtra
    plan: free                 # upgrade to starter ($7/mo) to avoid cold starts
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn backend.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: GROQ_API_KEY
        sync: false
      - key: DATABASE_URL
        sync: false          # set manually in Render dashboard
      - key: ALLOWED_ORIGINS
        value: https://amravati-sarthi.vercel.app
      - key: PYTHON_VERSION
        value: "3.11"
    healthCheckPath: /health
    autoDeploy: true           # redeploys on every git push to main